name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native --junit-output-path native-tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-tests
          path: native-tests.xml

  native-sanitize:
    name: Native tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests with sanitizers
        run: pio test -e native-sanitize

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO and gcovr
        run: python -m pip install --upgrade platformio gcovr

      - name: Measure coverage (fails below 100 % lines / 70 % branches)
        run: scripts/coverage.sh --html | tee coverage.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Native test coverage (src/core, src/hardware, src/application)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: docs/generated/coverage

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-check

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run cppcheck
        run: pio check -e native --fail-on-defect medium --fail-on-defect high

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-esp32

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware (offline, no secrets.h)
        run: pio run -e esp32dev

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf

      - name: Build firmware with Wi-Fi + webhook (template secrets)
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run -e esp32dev

      - name: Build calibration firmware
        run: pio run -e esp32dev-calibration

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install "clang-format~=23.1"

      - name: Check formatting
        run: scripts/check-format.sh

  wokwi:
    # Runs the automated simulation scenario when a Wokwi CI token is configured
    # (Settings > Secrets > Actions > WOKWI_CLI_TOKEN). Skipped on forks.
    name: Wokwi simulation
    runs-on: ubuntu-latest
    needs: firmware
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: .pio/build/esp32dev

      - name: Run scenario
        if: env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: wokwi
          scenario: scenario.yaml
          timeout: 90000
          expect_text: "[STATE] REARMING -> IDLE"

      - name: Skipped
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "WOKWI_CLI_TOKEN not set; simulation skipped"

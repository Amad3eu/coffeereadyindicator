name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native --junit-output-path native-tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-tests
          path: native-tests.xml

  native-sanitize:
    name: Native tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests with sanitizers
        run: pio test -e native-sanitize

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-native

      - name: Install PlatformIO and gcovr
        run: python -m pip install --upgrade platformio gcovr

      - name: Measure coverage (fails below 100 % lines / 70 % branches)
        run: scripts/coverage.sh --html | tee coverage.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Native test coverage (src/core, src/hardware, src/application)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: docs/generated/coverage

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-check

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run cppcheck
        run: pio check -e native --fail-on-defect medium --fail-on-defect high

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-esp32

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware (offline, no secrets.h)
        run: pio run -e esp32dev

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf

      - name: Build firmware with Wi-Fi + webhook (template secrets)
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run -e esp32dev

      - name: Build calibration firmware
        run: pio run -e esp32dev-calibration

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install "clang-format~=23.1"

      - name: Check formatting
        run: scripts/check-format.sh

  wokwi-check:
    # Token-independent validation of the simulation files, plus the honest
    # answer to "did the real scenario run?": the job below is SKIPPED (grey,
    # not green) when the WOKWI_CLI_TOKEN secret is missing.
    name: Wokwi scenario check
    runs-on: ubuntu-latest
    outputs:
      token-configured: ${{ steps.token.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate diagram.json and scenario.yaml against the firmware
        run: |
          python -m pip install pyyaml
          python scripts/check_wokwi_scenario.py

      - name: Is WOKWI_CLI_TOKEN configured?
        id: token
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          if [ -n "$WOKWI_CLI_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wokwi::WOKWI_CLI_TOKEN is configured; the real scenario runs in the 'Wokwi simulation' job"
            echo "## Wokwi: token configured, real scenario will run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Wokwi scenario SKIPPED::WOKWI_CLI_TOKEN is not configured. The simulation files were validated statically only; the real scenario did NOT run. See docs/testing/wokwi-ci.md"
            {
              echo "## Wokwi: real scenario SKIPPED"
              echo
              echo "\`WOKWI_CLI_TOKEN\` is not configured, so the automated simulation did **not** run."
              echo "Only the static check of \`wokwi/diagram.json\` and \`wokwi/scenario.yaml\` passed."
              echo "Configure the secret as described in \`docs/testing/wokwi-ci.md\` to make this a real validation."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  wokwi:
    # Runs the automated simulation scenario for real. Skipped (not green)
    # when the repository has no WOKWI_CLI_TOKEN secret
    # (Settings > Secrets and variables > Actions > New repository secret).
    name: Wokwi simulation
    runs-on: ubuntu-latest
    needs: [firmware, wokwi-check]
    if: needs.wokwi-check.outputs.token-configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: .pio/build/esp32dev

      - name: Run scenario
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: wokwi
          scenario: scenario.yaml
          timeout: 180000
          expect_text: "[STATE] READY -> COMPLETED"

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice title=Wokwi scenario EXECUTED::wokwi/scenario.yaml ran for real and passed"
            echo "## Wokwi: real scenario EXECUTED and passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Wokwi scenario FAILED::wokwi/scenario.yaml ran for real and failed; see the step log"
            echo "## Wokwi: real scenario EXECUTED and FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

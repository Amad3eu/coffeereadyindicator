name: Docs

# Builds the architecture PDF and the README GIF. Artifacts only; nothing is
# committed. Trigger manually or on changes to documentation sources.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs.py"
      - "scripts/generate_demo_gif.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build_docs.py"
      - "scripts/generate_demo_gif.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  pdf:
    name: Architecture PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install pandoc and a LaTeX engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra lmodern fonts-dejavu

      - name: Build PDF
        run: python3 scripts/build_docs.py

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: coffee-sentinel-architecture
          path: |
            docs/generated/coffee-sentinel-architecture.pdf
            docs/generated/diagrams/*.png

  gif:
    name: README GIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate GIF
        run: python scripts/generate_demo_gif.py

      - name: Upload GIF
        uses: actions/upload-artifact@v4
        with:
          name: coffee-flow-gif
          path: docs/images/coffee-flow.gif

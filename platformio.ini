; Coffee Sentinel - PlatformIO project configuration
;
; Environments:
;   esp32dev              -> firmware for the ESP32 DevKit V1 (default)
;   esp32dev-calibration  -> same board, boots into the interactive calibration mode
;   native                -> host build used by `pio test -e native` (no hardware required)
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = ESP32-powered coffee machine watcher that tells the office when the coffee is ready

[env]
build_flags =
    -DCOFFEE_SENTINEL_VERSION=\"0.1.0\"

; ---------------------------------------------------------------------------
; ESP32 firmware
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The Arduino core defaults to gnu++11; the code base uses C++17.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>

; Boots into the interactive calibration mode (see docs/calibration.md).
[env:esp32dev-calibration]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DCOFFEE_CALIBRATION_MODE=1

; ---------------------------------------------------------------------------
; Host build: unit tests without hardware (`pio test -e native`)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Werror
    -Itest
; Only the platform-independent layers are compiled into the test binaries.
build_src_filter = +<core/> +<hardware/> +<application/>
test_build_src = yes

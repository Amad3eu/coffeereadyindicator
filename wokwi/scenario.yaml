# Automated Wokwi scenario (https://docs.wokwi.com/wokwi-ci/automation-scenarios).
#
#   pio run -e esp32dev
#   wokwi-cli wokwi --scenario scenario.yaml --timeout 45000
#
# The potentiometer stands in for the coffee machine LED (high = green) and
# the push button is "START COFFEE". The three manual scenarios from the
# project brief are chained: a START pressed while the machine is already
# green must not alert; a short green must not alert; after COMPLETED the
# light is ignored until the next START.
#
# Ordering rule (wokwi-cli): `wait-serial` only sees serial bytes emitted
# AFTER the step starts. Every expected line must therefore be waited for
# right after the action that triggers it, never after a `delay`, and the
# button is released only after its lines were matched. Total simulated time
# is about 28 s; the CI timeout is 45 s of simulated time.
name: "Brew session: start, arm, ready, complete"
version: 1
author: "Coffee Sentinel"

steps:
  - wait-serial: "State: IDLE"

  # --- Scenario A: machine already green when START is pressed ----------------
  - set-control:
      part-id: pot1
      control: position
      value: 0.9
  - delay: 500ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "[BUTTON] START pressed"
  - wait-serial: "[STATE] IDLE -> STARTING"
  - wait-serial: "[EVENT] BrewStarted"
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  # Still green for longer than readyConfirmationMs: nothing may happen.
  - delay: 4000ms
  # The machine leaves its green state: the session arms after cycleStartConfirmationMs.
  - set-control:
      part-id: pot1
      control: position
      value: 0.02
  - wait-serial: "[STATE] STARTING -> BREWING"
  - wait-serial: "[EVENT] BrewArmed"

  # --- Scenario B: short green does not alert, steady green does ------------
  - set-control:
      part-id: pot1
      control: position
      value: 0.9
  - delay: 1500ms
  - set-control:
      part-id: pot1
      control: position
      value: 0.02
  - delay: 1500ms
  - set-control:
      part-id: pot1
      control: position
      value: 0.9
  - wait-serial: "[STATE] BREWING -> READY"
  - wait-serial: "[EVENT] CoffeeReady"
  - wait-serial: "[NOTIFY] Coffee is ready"
  - wait-serial: "[STATE] READY -> COMPLETED"
  - wait-serial: "[EVENT] BrewCompleted"

  # --- Scenario C: after COMPLETED the light is ignored until START ---------
  - set-control:
      part-id: pot1
      control: position
      value: 0.02
  - delay: 3500ms
  - set-control:
      part-id: pot1
      control: position
      value: 0.9
  - delay: 3500ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "[STATE] COMPLETED -> STARTING"
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - set-control:
      part-id: pot1
      control: position
      value: 0.02
  - wait-serial: "[STATE] STARTING -> BREWING"
  - set-control:
      part-id: pot1
      control: position
      value: 0.9
  - wait-serial: "[STATE] BREWING -> READY"
  - wait-serial: "[STATE] READY -> COMPLETED"
